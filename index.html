<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/assets/logos/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7F95D1" />

    <!-- HTML Meta Tags -->
    <title>Bubble Map | Free, AI-Assisted Mind Mapping</title>
    <meta
      name="description"
      content="Free, open-source mind mapping with AI-assisted brainstorming, real-time collaboration, and PNG, SVG, and Markdown export. Start instantly - no sign-up required."
    />
    <link rel="canonical" href="https://bubblemap.app/" />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://bubblemap.app/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Bubble Map | Free, AI-Assisted Mind Mapping"
    />
    <meta
      property="og:description"
      content="Free, open-source mind mapping with AI-assisted brainstorming, real-time collaboration, and PNG, SVG, and Markdown export. Start instantly - no sign-up required."
    />
    <meta
      property="og:image"
      content="https://bubblemap.app/assets/logos/Bubble%20Map%20Logo.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="1000" />
    <meta property="og:image:alt" content="The Bubble Map logo" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Bubble Map | Free, AI-Assisted Mind Mapping"
    />
    <meta
      name="twitter:description"
      content="Free, open-source mind mapping with AI-assisted brainstorming, real-time collaboration, and PNG, SVG, and Markdown export. Start instantly - no sign-up required."
    />
    <meta
      name="twitter:image"
      content="https://bubblemap.app/assets/logos/Bubble%20Map%20Logo.png"
    />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bubble Map",
        "url": "https://bubblemap.app/",
        "description": "Free, open-source mind mapping with AI-assisted brainstorming, real-time collaboration, and PNG, SVG, and Markdown export.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "image": "https://bubblemap.app/assets/logos/Bubble%20Map%20Logo.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "award": "Winner of the 2022 Congressional App Challenge (AZ-06)"
      }
    </script>

    <link
      rel="apple-touch-icon"
      href="/assets/logos/Simple%20Bubble%20Map%20Logo.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="padding: 0; margin: 0">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" style="padding: 0; margin: 0"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
