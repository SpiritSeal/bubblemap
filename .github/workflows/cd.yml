name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Upload Build and Deploy to Firebase
    if: github.repository_owner == 'SpiritSeal'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install ./ Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install ./functions Dependencies
        run: cd ./functions && npm ci --prefer-offline --no-audit && cd ..

      - name: TSC
        run: npm run tsc

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Build React
        run: npm run build

      - name: Create Build Assets
        run: |
          zip -r build.zip build
          tar -czf build.tar.gz build

      - name: Upload Build Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build.zip
            build.tar.gz

      - name: Deploy to Firebase (testing)
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa_key.json"
          npx firebase-tools deploy -P testing --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MIND_MAP_TESTING }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp_sa_key.json

      - name: Deploy to Firebase (production)
        if: '!github.event.release.prerelease'
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp_sa_key.json"
          npx firebase-tools deploy -P app --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUBBLEMAP_APP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp_sa_key.json
